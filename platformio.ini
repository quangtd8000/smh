; Smart Home prototype - ESP32-S3
; 3 node ESP32-S3, cùng 1 firmware, phân biệt bằng build flag NODE_ID.

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
monitor_rts = 0
monitor_dtr = 0
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^6.21.3

; env libtest có main riêng; các env khác bỏ qua thư mục đó.
build_src_filter = +<*> -<libtest/>

build_flags =
    -Iinclude
    -Isrc
    ; Driver Wire log lỗi mỗi lần cảm biến NACK, mà NACK lúc đang đo là bình
    ; thường -> tắt log của core, firmware tự in trạng thái. Cần soi sâu thì
    ; nâng lên 3 (info) hoặc 4 (debug).
    -DCORE_DEBUG_LEVEL=0
    ; DevKitC-1 có 2 cổng USB. Hai dòng dưới cho Serial chạy ra cổng "USB"
    ; (USB gốc của ESP32-S3). Nếu cắm cổng "UART" (qua chip cầu CH343/CP2102)
    ; thì bỏ 2 dòng này đi, lúc đó Serial là UART0 trên GPIO 43/44.
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=1

; Thư viện chính hãng Sensirion cho SGP41. Gas Index Algorithm là phần biến
; tín hiệu thô (ticks) thành VOC Index / NOx Index thang 0-500 - đây mới là
; con số đọc được, đừng tự viết lại.
[sgp41_libs]
lib_deps =
    ${env.lib_deps}
    sensirion/Sensirion I2C SGP41@^1.0.0
    sensirion/Sensirion Core@^0.7.1
    sensirion/Sensirion Gas Index Algorithm@^3.2.3

; ---------------------------------------------------------------------------
; Node 1: node cảm biến không khí (SHT31 + SGP41 + SCD41 + SPS30)
; SCD41 / SPS30 chưa có hàng -> để 0, khi nào lắp thì đổi thành 1.
; ---------------------------------------------------------------------------
[env:node-air]
lib_deps = ${sgp41_libs.lib_deps}
build_flags =
    ${env.build_flags}
    -DNODE_ID=1
    -DENABLE_SHT31=1
    -DENABLE_SGP41=1
    -DENABLE_SCD41=1
    -DENABLE_SPS30=0
    -DENABLE_RELAY=0
    -DENABLE_IR=0

; ---------------------------------------------------------------------------
; Node 2: node công tắc AC (relay đèn / quạt)
; ---------------------------------------------------------------------------
[env:node-relay]
build_flags =
    ${env.build_flags}
    -DNODE_ID=2
    -DENABLE_SHT31=0
    -DENABLE_SGP41=0
    -DENABLE_SCD41=0
    -DENABLE_SPS30=0
    -DENABLE_RELAY=1
    -DENABLE_IR=0

; ---------------------------------------------------------------------------
; Node 3: node phát hồng ngoại điều khiển điều hòa (VOKTTA 1W)
; ---------------------------------------------------------------------------
[env:node-ir]
build_flags =
    ${env.build_flags}
    -DNODE_ID=3
    -DENABLE_SHT31=0
    -DENABLE_SGP41=0
    -DENABLE_SCD41=0
    -DENABLE_SPS30=0
    -DENABLE_RELAY=0
    -DENABLE_IR=1

; ---------------------------------------------------------------------------
; Env đối chứng: gọi thẳng thư viện chính hãng, không qua lớp bọc của project.
; Dùng để chẩn đoán khi nghi ngờ phần cứng.
; ---------------------------------------------------------------------------
[env:libtest]
build_src_filter = -<*> +<libtest/>
lib_deps = ${sgp41_libs.lib_deps}
build_flags =
    ${env.build_flags}
    -DNODE_ID=99

; ---------------------------------------------------------------------------
; Env để test bench: bật hết mọi thứ đang có trên bàn
; ---------------------------------------------------------------------------
[env:bench]
lib_deps = ${sgp41_libs.lib_deps}
build_flags =
    ${env.build_flags}
    -DNODE_ID=0
    -DENABLE_SHT31=1
    -DENABLE_SGP41=1
    -DENABLE_SCD41=1
    -DENABLE_SPS30=0
    -DENABLE_RELAY=1
    -DENABLE_IR=1
