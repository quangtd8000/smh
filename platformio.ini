; Smart Home prototype - ESP32-S3
; CÙNG MỘT FIRMWARE CHO MỌI BOARD: UID suy từ MAC của chip, không ghim theo env.
; muốn ghim thì thêm -DDEVICE_UID=\"esp32-node-xyz\" vào build_flags của env đó.
[platformio]
default_envs = node-relay
[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
monitor_rts = 0
monitor_dtr = 0
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^6.21.3
    h2zero/NimBLE-Arduino@^1.4.2

; env libtest có main riêng; các env khác bỏ qua thư mục đó.
build_src_filter = +<*> -<libtest/>

build_flags =
    -Iinclude
    -Isrc
    ; Driver Wire log lỗi mỗi lần cảm biến NACK, mà NACK lúc đang đo là bình
    ; thường -> tắt log của core, firmware tự in trạng thái. Cần soi sâu thì
    ; nâng lên 3 (info) hoặc 4 (debug).
    -DCORE_DEBUG_LEVEL=0
    ; DevKitC-1 có 2 cổng USB. Cắm cổng UART (CH343) thì dùng UART0
    ; -DARDUINO_USB_CDC_ON_BOOT=1
    ; -DARDUINO_USB_MODE=1

; Thư viện chính hãng Sensirion cho SGP41. Gas Index Algorithm là phần biến
; tín hiệu thô (ticks) thành VOC Index / NOx Index thang 0-500 - đây mới là
; con số đọc được, đừng tự viết lại.
[sgp41_libs]
lib_deps =
    ${env.lib_deps}
    sensirion/Sensirion I2C SGP41@^1.0.0
    sensirion/Sensirion Core@^0.7.1
    sensirion/Sensirion Gas Index Algorithm@^3.2.3

; ---------------------------------------------------------------------------
; Node 1: node cảm biến không khí & mắt phát IR (SHT31 + SGP41 + SCD41 + SPS30 + IR TX)
; Treo trần/phòng khách, vừa đo chất lượng môi trường vừa phát IR điều khiển TV, AC
; ---------------------------------------------------------------------------
[env:node-air]
lib_deps = ${sgp41_libs.lib_deps}
build_flags =
    ${env.build_flags}
    -DENABLE_SHT31=1
    -DENABLE_SGP41=1
    -DENABLE_SCD41=1
    -DENABLE_SPS30=1
    -DENABLE_RELAY=0
    -DENABLE_IR=1

; ---------------------------------------------------------------------------
; Node 2: node công tắc AC (relay đèn / quạt)
; Định danh duy nhất bằng DEVICE_UID (topic smart_home/<uid>/...).
; ---------------------------------------------------------------------------
[env:node-relay]
build_flags =
    ${env.build_flags}
    -DENABLE_SHT31=0
    -DENABLE_SGP41=0
    -DENABLE_SCD41=0
    -DENABLE_SPS30=0
    -DENABLE_RELAY=1
    -DENABLE_IR=0

; ---------------------------------------------------------------------------
; Node 3: node phát hồng ngoại điều khiển điều hòa (VOKTTA 1W)
; Định danh duy nhất bằng DEVICE_UID (topic smart_home/<uid>/...).
; ---------------------------------------------------------------------------
[env:node-ir]
build_flags =
    ${env.build_flags}
    -DENABLE_SHT31=0
    -DENABLE_SGP41=0
    -DENABLE_SCD41=0
    -DENABLE_SPS30=0
    -DENABLE_RELAY=0
    -DENABLE_IR=1

; ---------------------------------------------------------------------------
; Env đối chứng: gọi thẳng thư viện chính hãng, không qua lớp bọc của project.
; Dùng để chẩn đoán khi nghi ngờ phần cứng.
; ---------------------------------------------------------------------------
[env:libtest]
build_src_filter = -<*> +<libtest/>
lib_deps = ${sgp41_libs.lib_deps}
build_flags =
    ${env.build_flags}
    -DNODE_ID=99

; ---------------------------------------------------------------------------
; Env để test bench: bật hết mọi thứ đang có trên bàn
; ---------------------------------------------------------------------------
[env:bench]
lib_deps = ${sgp41_libs.lib_deps}
build_flags =
    ${env.build_flags}
    -DNODE_ID=0
    -DENABLE_SHT31=1
    -DENABLE_SGP41=1
    -DENABLE_SCD41=1
    -DENABLE_SPS30=1
    -DENABLE_RELAY=1
    -DENABLE_IR=1
